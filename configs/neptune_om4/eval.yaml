# yaml-language-server: $schema=../schemas/EvalConfig.json
debug: false
save_zarr: true
disk_mode: true
ckpt_path: .LOCAL/train/neptune_om4/saved_nets/ema_ckpt.pt
num_model_steps_forward: 25
backend: cuda
forcing_mode: student
inference_time:
  start: '2014-10-10'
  end: '2022-12-24'
experiment:
  name: neptune_om4
  rand_seed: 15
  base_output_dir: .LOCAL/inference
  data_root: null
  wandb:
    mode: disabled
    project: default
    entity: ocean_emulators
    group: null
    tags: null
    notes: null
  prognostic_vars_key: thermo_dynamic_all
  boundary_vars_key: tau_hfds_hfds_anom
data:
  data_location: OM4.zarr
  data_means_location: OM4_means.zarr
  data_stds_location: OM4_stds.zarr
  static_data_vars: []
  num_workers: 1
  hist: 1
  loader_version: om4-torch
  normalize_before_mask: true
  masked_fill_value: 0.0
  concurrent_compute: true
model:
  type: neptune
  hidden_channels: 256
  decoder_mid_channels: 512
  modes:
  - 2
  - 2
  grid: legendre-gauss
  condition_dim: 256
  noise_dim: 32
  spatial_fourier_bands: 8
  temporal_fourier_bands: 4
  day_length_fourier_bands: 4
  dropout: 0.0
  mlp_ratio: 2
  inference_noise: fixed
  inference_noise_seed: 15
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  checkpointing: all
  gradient_detach_interval: 0
  add_3d_coordinates: false
  use_bfloat16: false
