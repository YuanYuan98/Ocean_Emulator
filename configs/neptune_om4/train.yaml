# yaml-language-server: $schema=../schemas/TrainConfig.json
disk_mode: true
pin_mem: true
save_freq: 5
epochs: 70
preemptible: true
batch_size: 16
learning_rate: 0.0006
gradient_accumulation_steps: 1
scheduler:
  type: cosine
  target_epochs: null
loss:
  type: dynamic
  metric: mse
  limit: 20.0
finetune: false
resume_ckpt_path: null
debug: false
test_using_ema: true
ema_decay: 0.999
faster_decay_at_start: true
backend: nccl
profiler:
  cuda_snapshot_frequency: null
data_percent: 1.0
data_stride:
- 1
steps:
- 4
step_transition: []
inference_epochs: []
train_time:
  start: '1975-01-03'
  end: '2013-10-05'
val_time:
  start: '2013-10-05'
  end: '2014-10-05'
inference_times:
- start: '1975-01-03'
  end: '1976-01-03'
- start: '1985-01-03'
  end: '1986-01-03'
- start: '1995-01-03'
  end: '1996-01-03'
- start: '2004-10-05'
  end: '2005-10-05'
experiment:
  name: neptune_om4
  rand_seed: 15
  base_output_dir: .LOCAL/train
  data_root: null
  wandb:
    mode: disabled
    project: default
    entity: ocean_emulators
    group: null
    tags: null
    notes: null
  prognostic_vars_key: thermo_dynamic_all
  boundary_vars_key: tau_hfds_hfds_anom
data:
  data_location: OM4.zarr
  data_means_location: OM4_means.zarr
  data_stds_location: OM4_stds.zarr
  static_data_vars: []
  num_workers: 1
  hist: 1
  loader_version: om4-torch
  normalize_before_mask: true
  masked_fill_value: 0.0
  concurrent_compute: true
model:
  type: neptune
  hidden_channels: 256
  decoder_mid_channels: 512
  modes:
  - 2
  - 2
  grid: legendre-gauss
  condition_dim: 256
  noise_dim: 32
  spatial_fourier_bands: 8
  temporal_fourier_bands: 4
  day_length_fourier_bands: 4
  dropout: 0.0
  mlp_ratio: 2
  inference_noise: fixed
  inference_noise_seed: 15
  pred_residuals: false
  last_kernel_size: 3
  pad: circular
  checkpointing: all
  gradient_detach_interval: 0
  add_3d_coordinates: false
  use_bfloat16: false
